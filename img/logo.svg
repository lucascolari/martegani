<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Martegani Bienes Raíces">
  <rect width="120" height="120" rx="10" fill="#221d1b"/>
  <!-- cluster de edificios -->
  <g>
    <!-- torre blanca izquierda -->
    <rect x="34" y="52" width="13" height="34" fill="#efe9e2"/>
    <g fill="#221d1b">
      <rect x="37" y="56" width="2.4" height="2.4"/><rect x="42" y="56" width="2.4" height="2.4"/>
      <rect x="37" y="62" width="2.4" height="2.4"/><rect x="42" y="62" width="2.4" height="2.4"/>
      <rect x="37" y="68" width="2.4" height="2.4"/><rect x="42" y="68" width="2.4" height="2.4"/>
      <rect x="37" y="74" width="2.4" height="2.4"/><rect x="42" y="74" width="2.4" height="2.4"/>
    </g>
    <!-- torre wine alta (atrás) con remate en punta -->
    <polygon points="49,86 49,40 55,31 61,40 61,86" fill="#9f3037"/>
    <rect x="52.5" y="44" width="5" height="40" fill="#7f262c"/>
    <!-- torre blanca central alta con remate inclinado -->
    <polygon points="62,86 62,46 76,38 76,86" fill="#efe9e2"/>
    <g fill="#221d1b">
      <rect x="65" y="50" width="2.6" height="2.6"/><rect x="70" y="49" width="2.6" height="2.6"/>
      <rect x="65" y="57" width="2.6" height="2.6"/><rect x="70" y="56" width="2.6" height="2.6"/>
      <rect x="65" y="64" width="2.6" height="2.6"/><rect x="70" y="64" width="2.6" height="2.6"/>
      <rect x="65" y="71" width="2.6" height="2.6"/><rect x="70" y="71" width="2.6" height="2.6"/>
    </g>
    <!-- bloque bajo derecha -->
    <rect x="77" y="60" width="11" height="26" fill="#d8cfc4"/>
  </g>
  <!-- wordmark -->
  <text x="60" y="100" text-anchor="middle" fill="#efe9e2" font-family="'Playfair Display', Georgia, serif" font-size="13" font-weight="600" letter-spacing="1.2">MARTEGANI</text>
  <text x="60" y="110" text-anchor="middle" fill="#b9ada0" font-family="'Inter', Arial, sans-serif" font-size="5.2" font-weight="500" letter-spacing="2.4">BIENES RAÍCES</text>
</svg>
